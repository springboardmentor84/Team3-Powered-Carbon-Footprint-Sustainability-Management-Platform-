<div class="register-container">
  <div class="register-card">

    <div class="logo">
      <img src="logo.png" alt="EcoTrack" width="70">
      <h2>Create Account</h2>
      <p>Create your EcoTrack account</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger" style="color: #dc3545; font-size: 0.9rem; margin-bottom: 1rem;">
      {{ errorMessage }}
    </div>
    <div *ngIf="isSuccess" class="alert alert-success" style="color: #198754; font-size: 0.9rem; margin-bottom: 1rem;">
      Account created successfully! Redirecting to login...
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName" placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="name@company.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Create password">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm password">
      </div>

      <button type="submit" class="register-btn" [disabled]="isLoading || isSuccess">
        {{ isLoading ? 'Creating Account...' : 'Create Account' }}
      </button>

    </form>

    <p class="login-link">
      Already have an account?
      <a routerLink="/auth/login">Login</a>
    </p>

  </div>
</div>
