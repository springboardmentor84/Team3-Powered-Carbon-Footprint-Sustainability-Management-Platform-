<div class="forgot-container">
  <img src="/logo.png" alt="EcoTrack Logo" class="logo" />

  <h2>Forgot Password?</h2>

  <p>Enter your registered email address and we'll send you a password reset link.</p>

  <!-- Status Alert Banners -->
  <div *ngIf="message" class="alert-banner success-banner">
    <i class="bi bi-check-circle-fill"></i>
    <span>{{ message }}</span>
  </div>

  <div *ngIf="errorMessage" class="alert-banner error-banner">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="email">Email Address</label>
      <input 
        id="email"
        type="email" 
        formControlName="email"
        placeholder="name@company.com" 
        [class.invalid-field]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid"
      />
      <span *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" class="validation-error">
        <i class="bi bi-exclamation-circle"></i> Please enter a valid email address.
      </span>
    </div>

    <!-- Keep button visible at all times, showing loading state and disabling it only during processing -->
    <button type="submit" [disabled]="isLoading" [class.btn-loading]="isLoading">
      <span class="btn-content-wrapper">
        <i *ngIf="isLoading" class="bi bi-arrow-repeat spin-icon"></i>
        <i *ngIf="isSuccess && !isLoading" class="bi bi-envelope-check-fill"></i>
        <span>
          {{ isLoading ? 'Sending...' : (isSuccess ? 'Resend Reset Link' : 'Send Reset Link') }}
        </span>
      </span>
    </button>
  </form>

  <a [routerLink]="['/auth/login']">
    ← Back to Login
  </a>
</div>
