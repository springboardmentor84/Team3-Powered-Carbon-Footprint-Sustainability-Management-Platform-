<div class="fade-in-section">
  <!-- Page Header -->
  <div class="ai-header">
    <h1>AI Sustainability Assistant</h1>
    <p class="subtitle text-secondary">
      Ask me about your sustainability scores, carbon emissions, or tips to improve any category.
    </p>
  </div>

  <!-- Full-Width Chat Window -->
  <div class="eco-card chat-window-card">

    <!-- Chat Messages Area -->
    <div class="chat-messages-container" #chatContainer>
      <div
        *ngFor="let msg of messages"
        class="chat-bubble-wrapper"
        [class.user-bubble-wrapper]="msg.sender === 'user'"
        [class.ai-bubble-wrapper]="msg.sender === 'ai'">

        <div class="bubble-avatar">
          <i class="bi" [ngClass]="msg.sender === 'ai' ? 'bi-robot text-success' : 'bi-person'"></i>
        </div>

        <div class="bubble-content-box">
          <div class="bubble-text" [innerHTML]="formatMessage(msg.text)"></div>
          <span class="bubble-time">{{ msg.timestamp }}</span>
        </div>
      </div>

      <!-- Typing Indicator -->
      <div *ngIf="isTyping" class="chat-bubble-wrapper ai-bubble-wrapper">
        <div class="bubble-avatar"><i class="bi bi-robot text-success"></i></div>
        <div class="bubble-content-box">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Suggestion Buttons (shown only before first user message) -->
    <div class="chat-suggestions" *ngIf="messages.length === 1 && !isTyping">
      <button
        class="suggestion-btn"
        *ngFor="let sug of promptSuggestions"
        (click)="onSendMessage(sug)">
        {{ sug }} &rarr;
      </button>
    </div>

    <!-- Message Input Bar -->
    <div class="chat-input-bar">
      <input
        type="text"
        placeholder="Ask Eco-AI about your scores or carbon tips..."
        [(ngModel)]="chatInput"
        (keyup.enter)="onSendMessage()"
        aria-label="AI prompt" />
      <button class="send-btn" (click)="onSendMessage()" [disabled]="!chatInput.trim()">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>
  </div>
</div>
