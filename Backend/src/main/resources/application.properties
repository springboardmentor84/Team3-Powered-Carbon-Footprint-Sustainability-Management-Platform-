# Server — Railway injects PORT automatically
server.port=${PORT:8081}

# PostgreSQL — Railway provides DATABASE_URL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ecotrack}
spring.datasource.username=${PGUSER:${DB_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:EcoTrackSuperSecretKeyForJWTAuthentication2026!}
jwt.expiration=86400000

# OpenAI
openai.api.key=${OPENAI_API_KEY:}