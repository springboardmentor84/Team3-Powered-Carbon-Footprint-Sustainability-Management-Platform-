# Server — Railway injects PORT automatically
server.port=${PORT:8081}

# PostgreSQL — Railway provides DATABASE_URL as a full JDBC connection string
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecotrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:EcoTrackSuperSecretKeyForJWTAuthentication2026!}
jwt.expiration=86400000

# OpenAI
openai.api.key=${OPENAI_API_KEY:}